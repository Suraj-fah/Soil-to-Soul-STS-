services:
  - type: web
    name: farmroute-direct
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farmroute-direct-db
          property: connectionString

databases:
  - name: farmroute-direct-db
    databaseName: farmroute_direct_db
    user: farmroute_direct_db_user
    plan: free
    region: singapore
    postgresMajorVersion: "18"
